[workspace]
members = [
    "crates/flashbrowse-bidi",
    "crates/flashbrowse-cdp",
    "crates/flashbrowse-core",
    "crates/flashbrowse-mcp",
    "crates/flashbrowse-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Only `deflate` is enabled: Chrome-for-Testing archives are deflate/store
# only, and the AES/LZMA/Zstd decoders are attack surface we never exercise.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
which = "7.0"
dashmap = "6.1"
regex = "1.11"
async-trait = "0.1"
url = "2.5"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nhrbuilds/flashbrowse"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
